server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/trip_db
    username: user
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    host: localhost
    port: 5673
    username: guest
    password: guest

  data:
    redis:
      host: localhost
      port: 6379